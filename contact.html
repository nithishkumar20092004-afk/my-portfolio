<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Your Name through an accessible, keyboard-friendly contact form.">
  <meta name="author" content="Your Name">
  <meta name="robots" content="index, follow">
  <title>Contact | Your Name</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html" aria-label="Your Name home">Your Name</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
    <nav id="primary-nav" aria-label="Primary navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a aria-current="page" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main-content">
  <section class="page-hero" aria-labelledby="page-title">
    <div class="container">
      <p class="eyebrow">Contact</p>
      <h1 id="page-title">Let’s start a conversation</h1>
      <p class="lead">All fields marked with <span aria-hidden="true">*</span> are required.</p>
    </div>
  </section>

  <section class="section" aria-labelledby="form-title">
    <div class="container form-layout">
      <div>
        <h2 id="form-title">Send a message</h2>
        <p id="form-help">Use the form to share a project idea, question or message.</p>
      </div>

      <form id="contact-form" novalidate aria-describedby="form-help">
        <div class="form-group">
          <label for="name">Full name <span aria-hidden="true">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" required aria-required="true" aria-describedby="name-error">
          <p class="error-message" id="name-error" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="email">Email address <span aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-required="true" aria-describedby="email-error">
          <p class="error-message" id="email-error" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="subject">Subject <span aria-hidden="true">*</span></label>
          <input id="subject" name="subject" type="text" required aria-required="true" aria-describedby="subject-error">
          <p class="error-message" id="subject-error" role="alert"></p>
        </div>

        <div class="form-group">
          <label for="message">Message <span aria-hidden="true">*</span></label>
          <textarea id="message" name="message" rows="7" required aria-required="true" aria-describedby="message-error"></textarea>
          <p class="error-message" id="message-error" role="alert"></p>
        </div>

        <button class="button primary" type="submit">Send message</button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; <span data-year></span> Your Name. All rights reserved.</p>
    <p><a href="index.html">Home</a> · <a href="projects.html">Projects</a></p>
  </div>
</footer>
<script src="script.js" defer></script>
</body>
</html>
